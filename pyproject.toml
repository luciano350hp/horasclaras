[project]
name = "horasclaras"
version = "0.1.0"
description = "Sistema de gestion de horas y tarifas para profesionales freelance"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2",
    "pydantic-settings",
    "reportlab",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]